name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "*/30 * * * *"   # nieuws elke ~30 minuten verversen (GitHub kan dit een paar minuten uitstellen)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nieuws ophalen
        run: node scripts/fetch-feeds.mjs
      - name: Versienummer in de service worker zetten
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
